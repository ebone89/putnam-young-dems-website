# Decap CMS configuration for putnamyoungdemsfl.org
# Docs: https://decapcms.org/docs/

backend:
  name: github
  repo: ebone89/putnam-young-dems-website
  branch: main
  # Points to the OAuth handler in worker.js
  base_url: https://putnamyoungdemsfl.org
  auth_endpoint: /api/auth

# Where uploaded images are stored in the repo
media_folder: assets/images
public_folder: /assets/images

collections:

  # ── Upcoming Events ────────────────────────────────────────────────────────
  # Manages _data/events.json — the file that index.html and events.html read.
  # Add, edit, or hide events here without touching any HTML.
  - name: events_data
    label: Events
    files:
      - label: Upcoming Events
        name: upcoming
        file: _data/events.json
        format: json
        fields:
          - label: Events
            name: events
            widget: list
            label_singular: Event
            fields:
              - label: Title
                name: title
                widget: string
                hint: "e.g. Monthly Meeting, Voter Registration Drive"

              - label: Start Date
                name: startDate
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true
                hint: "The day this event starts. Shows on the calendar and event list."

              - label: End Date
                name: endDate
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true
                required: false
                hint: "Only set this for multi-day events. Leave blank otherwise."

              - label: Time
                name: timeLabel
                widget: string
                hint: "e.g. 10:00 a.m. – 2:00 p.m."

              - label: Location Name
                name: location
                widget: string
                hint: "e.g. Putnam County Democratic Center"

              - label: Street Address
                name: address
                widget: string
                hint: "e.g. 914 St. Johns Ave., Suite 2"

              - label: City / State / ZIP
                name: cityState
                widget: string
                hint: "e.g. Palatka, FL 32177"

              - label: Description
                name: description
                widget: text
                hint: "One or two sentences shown on the site."

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide this event without deleting it."

  # ── Voter Registration ─────────────────────────────────────────────────────
  # Manages _data/voter-registration.json — the "Register to Vote" section
  # at the top of voter-resources.html, including Supervisor of Elections
  # contact info.
  - name: voter_registration
    label: Voter Registration
    files:
      - label: Register to Vote
        name: registration
        file: _data/voter-registration.json
        format: json
        fields:
          - { label: Heading, name: heading, widget: string }
          - { label: Intro Text, name: intro, widget: text }
          - { label: Office Name, name: officeName, widget: string }
          - { label: Office Address, name: officeAddress, widget: string, required: false }
          - { label: Office Phone, name: officePhone, widget: string, required: false }
          - { label: Office Website, name: officeWebsite, widget: string, required: false }
          - label: Online Registration Link
            name: onlineRegistrationUrl
            widget: string
            required: false
            hint: "Link to the Florida voter registration portal or the county's own registration page."

  # ── Election Dates ─────────────────────────────────────────────────────────
  # Manages _data/election-dates.json — the key-dates chart on voter-resources.html
  # (registration deadlines, early voting windows, election day). Add a new
  # row per election cycle; old rows can be unpublished rather than deleted
  # so past cycles stay in the file for reference.
  - name: election_dates
    label: Election Dates
    files:
      - label: Key Dates
        name: dates
        file: _data/election-dates.json
        format: json
        fields:
          - { label: Section Heading, name: heading, widget: string }
          - label: Dates
            name: dates
            widget: list
            label_singular: Date
            fields:
              - label: Election
                name: election
                widget: string
                hint: "e.g. Primary Election, General Election. Rows are grouped by this on the page."

              - label: What This Date Is
                name: label
                widget: string
                hint: "e.g. Deadline to register to vote or change party affiliation"

              - label: Date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true

              - label: End Date (for a date range)
                name: dateEnd
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true
                required: false
                hint: "Only set this for a range like early voting. Leave blank for a single day."

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide this row without deleting it, e.g. once a deadline has passed."

  # ── Ballot Guide ───────────────────────────────────────────────────────────
  # Manages _data/ballot-guide.json — the plain-language explainer of what's
  # on the upcoming primary/general ballot, on ballot-guide.html. Covers both
  # candidate races and ballot measures/amendments under one list; use "Type"
  # to tell them apart. Entries are placeholders until real ballot content is
  # confirmed — leave Published unchecked for anything not ready to go live.
  - name: ballot_guide_data
    label: Ballot Guide
    files:
      - label: Ballot Entries
        name: entries
        file: _data/ballot-guide.json
        format: json
        fields:
          - label: Entries
            name: entries
            widget: list
            label_singular: Entry
            fields:
              - label: Type
                name: type
                widget: select
                options: ["Candidate Race", "Ballot Measure", "Informational"]

              - label: Title
                name: title
                widget: string
                hint: "e.g. \"U.S. House, District 6\" or \"Amendment 3: Property Insurance Reform\""

              - label: Plain-Language Summary
                name: summary
                widget: text
                hint: "What this race or measure actually is/does, in a sentence or two, no jargon."

              - label: Candidates or Key Provisions
                name: details
                widget: text
                required: false
                hint: "For a race: who's running and their party. For a measure: what a yes/no vote does."

              - label: Learn More Link
                name: moreInfoUrl
                widget: string
                required: false
                hint: "Link to the official ballot language, candidate site, or a news explainer."

              - label: Published
                name: published
                widget: boolean
                default: false
                hint: "Leave unchecked until the entry's content is confirmed and ready to go live."

  # ── Elected Officials ──────────────────────────────────────────────────────
  # Manages _data/officials.json, displayed on elected-officials.html grouped
  # by level (with a section picker) then by category within each level.
  - name: officials_data
    label: Elected Officials
    files:
      - label: Officials Directory
        name: directory
        file: _data/officials.json
        format: json
        fields:
          - label: Officials
            name: officials
            widget: list
            label_singular: Official
            fields:
              - label: Name
                name: name
                widget: string

              - label: Office
                name: office
                widget: string
                hint: "e.g. U.S. House of Representatives, Governor, State Senate"

              - label: Level
                name: level
                widget: select
                options: ["Federal", "State", "County", "City", "Judicial"]
                hint: "Which page section this appears under. Judicial covers state and county judges/justices; City covers town/municipal offices."

              - label: Category
                name: category
                widget: string
                required: false
                hint: "Subheading to group cards within the level, e.g. \"County Commission\", \"Constitutional Officers\", \"Town of Interlachen\"."

              - label: Party
                name: party
                widget: select
                options: ["Democrat", "Republican", "Independent", "Nonpartisan"]

              - label: District
                name: district
                widget: string
                required: false
                hint: "e.g. District 5. Leave blank for offices without a district."

              - label: Address
                name: address
                widget: string
                required: false

              - label: Phone
                name: phone
                widget: string
                required: false

              - label: Email
                name: email
                widget: string
                required: false

              - label: Website
                name: website
                widget: string
                required: false

              - label: Photo
                name: photo
                widget: image
                required: false

              - label: Notes
                name: notes
                widget: text
                required: false
                hint: "Anything worth flagging, e.g. term end date or committee role."

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide this entry without deleting it."

  # ── Photo Gallery ──────────────────────────────────────────────────────────
  # Manages _data/gallery.json — the photo grid shown on gallery.html.
  - name: gallery_data
    label: Photo Gallery
    files:
      - label: Gallery Photos
        name: photos
        file: _data/gallery.json
        format: json
        fields:
          - label: Photos
            name: photos
            widget: list
            label_singular: Photo
            fields:
              - label: Photo
                name: photo
                widget: image

              - label: Caption
                name: caption
                widget: string
                hint: "Describe what is in the photo. Shown as alt text and a caption."

              - label: Date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true
                required: false

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide this photo without deleting it."

  # ── Documents ────────────────────────────────────────────────────────────────
  # Manages _data/documents.json — the file list shown on documents.html.
  # Bylaws, charter paperwork, and other official PCYD records.
  - name: documents_data
    label: Documents
    files:
      - label: Official Documents
        name: documents
        file: _data/documents.json
        format: json
        fields:
          - label: Documents
            name: documents
            widget: list
            label_singular: Document
            fields:
              - label: Title
                name: title
                widget: string
                hint: "e.g. PCYD Bylaws, Founding Charter"

              - label: Description
                name: description
                widget: text
                required: false

              - label: File
                name: file
                widget: file
                hint: "Upload the PDF or other document file."

              - label: Date
                name: date
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: true
                time_format: false
                picker_utc: true
                required: false

              - label: Published
                name: published
                widget: boolean
                default: true
                hint: "Uncheck to hide this document without deleting it."

  # ── Page Content ───────────────────────────────────────────────────────────
  # Manages _data/content.json plus one JSON file per page — nearly all of
  # the written copy on the site. Edit wording, cards, and contact details
  # here any time without touching HTML.
  - name: site_content
    label: Page Content
    files:
      - label: Community Context
        name: community
        file: _data/content.json
        format: json
        fields:
          - label: About Page Heading
            name: aboutCommunityHeading
            widget: string

          - label: About Page Text
            name: aboutCommunityBody
            widget: text
            hint: "Longer version shown on the About page. Leave a blank line between paragraphs."

      - label: Home Page
        name: home
        file: _data/home.json
        format: json
        fields:
          - label: Banner Tag
            name: heroTag
            widget: string
            hint: "Small pill above the headline, e.g. \"Forming · Pre-Charter 2026\""

          - label: Headline
            name: heroHeading
            widget: text
            hint: "Shown as two lines on the home page. Put the break where you want the line to wrap."

          - label: Intro Text
            name: heroBody
            widget: text

          - label: "\"What We Do\" Heading"
            name: whatWeDoHeading
            widget: string

          - label: "\"What We Do\" Intro"
            name: whatWeDoIntro
            widget: text

          - label: "\"What We Do\" Cards"
            name: whatWeDoCards
            widget: list
            label_singular: Card
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: body, widget: text }

          - label: Closing Heading
            name: ctaHeading
            widget: string

          - label: Closing Text
            name: ctaBody
            widget: text

      - label: About Page
        name: about
        file: _data/about-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: Group Photo
            name: groupPhoto
            widget: image
            required: false
            hint: "Shown under the page intro. Leave blank to show a placeholder. Best size: about 1200x675px (16:9), landscape, under 1MB."
          - { label: Mission Heading, name: missionHeading, widget: string }
          - label: Mission Text
            name: missionBody
            widget: text
            hint: "Leave a blank line between paragraphs."
          - { label: Membership Heading, name: membershipHeading, widget: string }
          - { label: Membership Intro, name: membershipIntro, widget: text }
          - label: Membership Tiers
            name: membershipTiers
            widget: list
            label_singular: Tier
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: body, widget: text }
          - { label: Membership Closing Text, name: membershipClosing, widget: text }
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Get Involved Page
        name: getInvolved
        file: _data/get-involved-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: Photo
            name: photo
            widget: image
            required: false
            hint: "Shown under the page intro. Leave blank to show a placeholder. Best size: about 1200x675px (16:9), landscape, under 1MB."
          - { label: "\"Ways to Participate\" Heading", name: waysHeading, widget: string }
          - label: "\"Ways to Participate\" Cards"
            name: waysCards
            widget: list
            label_singular: Card
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Text, name: body, widget: text }
          - { label: "\"Who Can Join\" Heading", name: whoHeading, widget: string }
          - label: "\"Who Can Join\" Text"
            name: whoBody
            widget: text
            hint: "Leave a blank line between paragraphs."
          - { label: "\"What to Expect\" Heading", name: expectHeading, widget: string }
          - label: "\"What to Expect\" Text"
            name: expectBody
            widget: text
            hint: "Leave a blank line between paragraphs."
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Events Page
        name: eventsPage
        file: _data/events-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: Election Date Note
            name: electionNote
            widget: text
            hint: "The small line under the page intro, e.g. primary/general election dates. Update each election cycle."
          - { label: Calendar Heading, name: calendarHeading, widget: string }
          - { label: RSVP Heading, name: rsvpHeading, widget: string }
          - { label: RSVP Intro, name: rsvpIntro, widget: text }
          - { label: "\"Upcoming Events\" Heading", name: upcomingHeading, widget: string }
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Voter Resources Page
        name: voterResourcesPage
        file: _data/voter-resources-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: "\"Learn More\" Heading"
            name: linksHeading
            widget: string
            hint: "Heading above the links to external voter tools (voteputnamflorida.gov, vote411.org)."
          - label: "\"Learn More\" Intro"
            name: linksIntro
            widget: text
          - label: Elected Officials Callout Heading
            name: officialsHeading
            widget: string
            hint: "Heading on the card pointing to elected-officials.html."
          - label: Elected Officials Callout Text
            name: officialsBody
            widget: text
          - label: Putnam Watch Callout Heading
            name: putnamWatchHeading
            widget: string
            hint: "Heading on the card pointing to /putnam-watch/ for the accountability/promise tracker."
          - label: Putnam Watch Callout Text
            name: putnamWatchBody
            widget: text
          - { label: Ballot Guide Callout Heading, name: ballotGuideHeading, widget: string }
          - { label: Ballot Guide Callout Text, name: ballotGuideBody, widget: text }
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Elected Officials Page
        name: electedOfficialsPage
        file: _data/elected-officials-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: Top Photo
            name: heroPhoto
            widget: image
            required: false
            hint: "Shown under the page intro. Defaults to the Florida State Capitol photo if left blank. Best size: about 1200x675px (16:9), landscape, under 1MB."
          - { label: Federal Officials Heading, name: federalHeading, widget: string }
          - { label: Federal Officials Intro, name: federalIntro, widget: text }
          - { label: State Officials Heading, name: stateHeading, widget: string }
          - { label: State Officials Intro, name: stateIntro, widget: text }
          - { label: County Officials Heading, name: countyHeading, widget: string }
          - { label: County Officials Intro, name: countyIntro, widget: text }
          - { label: City / Municipal Officials Heading, name: cityHeading, widget: string }
          - { label: City / Municipal Officials Intro, name: cityIntro, widget: text }
          - { label: Judicial Officials Heading, name: judicialHeading, widget: string }
          - { label: Judicial Officials Intro, name: judicialIntro, widget: text }
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Ballot Guide Page
        name: ballotGuidePage
        file: _data/ballot-guide-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - label: Closed Primary Note
            name: primaryNote
            widget: text
            hint: "Highlighted callout explaining Florida's closed primary rule. Update if the rule or exceptions change."
          - label: Empty State Text
            name: emptyStateBody
            widget: text
            hint: "Shown if no entries are published yet."
          - { label: Closing Heading, name: ctaHeading, widget: string }
          - { label: Closing Text, name: ctaBody, widget: text }

      - label: Gallery Page
        name: galleryPage
        file: _data/gallery-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }

      - label: Documents Page
        name: documentsPage
        file: _data/documents-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }

      - label: Contact Page
        name: contact
        file: _data/contact-page.json
        format: json
        fields:
          - { label: Page Headline, name: heroHeading, widget: string }
          - { label: Page Intro, name: heroBody, widget: text }
          - { label: Email Address, name: email, widget: string }
          - { label: Phone Number (displayed), name: phone, widget: string }
          - label: Phone Number (dial link)
            name: phoneHref
            widget: string
            hint: "Digits only with country code, e.g. +13865551234"
          - { label: Location Name, name: locationName, widget: string }
          - { label: Street Address, name: address, widget: string }
          - { label: City / State / ZIP, name: cityState, widget: string }
          - { label: Facebook URL, name: facebookUrl, widget: string, required: false }
          - { label: Instagram URL, name: instagramUrl, widget: string, required: false }
          - { label: Form Section Heading, name: formHeading, widget: string }
          - { label: Form Section Intro, name: formIntro, widget: text }
          - { label: "\"Find Us\" Heading", name: findUsHeading, widget: string }
          - { label: "\"Find Us\" Text", name: findUsBody, widget: text }
